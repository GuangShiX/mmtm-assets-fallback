name: Update MementoMori data

on:
  schedule:
    # Three full baseline checks remain available for unscheduled hot updates.
    - cron: "37 0,12,18 * * *"
    # All other scheduled runs are lightweight probes. The full updater runs
    # only from 15 minutes after an official maintenance start through 15
    # minutes after its official end.
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mementomori-fallback-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out image repository
        uses: actions/checkout@v6

      - name: Check out tracker
        uses: actions/checkout@v6
        with:
          repository: GuangShiX/mmtm-apk-tracker
          path: _tracker

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _tracker/requirements.txt

      - name: Install maintenance probe dependencies
        run: python -m pip install msgpack==1.1.2 requests==2.32.5

      - name: Evaluate official maintenance window
        id: maintenance
        env:
          FORCE_UPDATE: ${{ github.event_name != 'schedule' || github.event.schedule == '37 0,12,18 * * *' }}
        run: >-
          python _tracker/maintenance.py
          --start-offset-minutes 15
          --end-offset-minutes 15
          --github-output "$GITHUB_OUTPUT"

      - name: Install full Python dependencies
        if: steps.maintenance.outputs.should_run == 'true'
        run: python -m pip install -r _tracker/requirements.txt

      - name: Install Chinese fonts
        if: steps.maintenance.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Detect and merge image updates
        id: images
        if: steps.maintenance.outputs.should_run == 'true'
        continue-on-error: true
        run: >-
          python _tracker/fallback.py
          --auto-update
          --output .
          --repository GuangShiX/mmtm-assets-fallback

      - name: Verify requested official images
        id: image_verify
        if: steps.images.outcome == 'success'
        continue-on-error: true
        run: >-
          python _tracker/asset_requests.py
          verify-repository
          --repository .

      - name: Detect and export Master skill updates
        id: skills
        if: steps.maintenance.outputs.should_run == 'true'
        continue-on-error: true
        run: >-
          python _tracker/master.py
          --auto-update
          --language zh-CN
          --language ja-JP
          --output .
          --repository GuangShiX/mmtm-assets-fallback

      - name: Detect latest character card updates
        id: card_plan
        if: steps.skills.outcome == 'success'
        shell: bash
        run: |
          if python _tracker/skill_card.py \
            --verify-latest \
            --skills-dir skills \
            --output-dir cards/characters \
            --mode compact \
            --language zh-CN; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Latest compact character cards are current."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Latest compact character cards need to be generated."
          fi

      - name: Render latest character skill cards
        id: cards
        if: steps.skills.outcome == 'success' && steps.card_plan.outputs.needed == 'true'
        continue-on-error: true
        run: >-
          python _tracker/skill_card.py
          --latest
          --skills-dir skills
          --output-dir cards/characters
          --cache-dir "${{ runner.temp }}/mmtm-skill-card-cache"
          --mode compact
          --language zh-CN

      - name: Verify latest character skill cards
        id: card_verify
        if: always() && steps.skills.outcome == 'success'
        continue-on-error: true
        run: >-
          python _tracker/skill_card.py
          --verify-latest
          --skills-dir skills
          --output-dir cards/characters
          --mode compact
          --language zh-CN

      - name: Commit verified data changes
        if: >-
          always() &&
          (
            (steps.images.outcome == 'success' && steps.image_verify.outcome == 'success') ||
            steps.skills.outcome == 'success' ||
            steps.card_verify.outcome == 'success'
          )
        env:
          IMAGES_VERIFIED: ${{ steps.images.outcome == 'success' && steps.image_verify.outcome == 'success' }}
          SKILLS_VERIFIED: ${{ steps.skills.outcome == 'success' }}
          CARDS_VERIFIED: ${{ steps.card_verify.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$IMAGES_VERIFIED" = "true" ]; then
            git add -A -- assets manifest.json latest.json
          fi
          if [ "$SKILLS_VERIFIED" = "true" ] && [ -e skills ]; then
            git add -A -- skills
          fi
          if [ "$CARDS_VERIFIED" = "true" ] && [ -e cards ]; then
            git add -A -- cards
          fi
          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi
          version="$(python -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          if [ -f skills/latest.json ]; then
            master="$(python -c 'import json; print(json.load(open("skills/latest.json", encoding="utf-8"))["source"]["master_version"])')"
          else
            master="unavailable"
          fi
          git commit -m "Update MementoMori data for $version ($master)"
          git push origin main
          if [ "$IMAGES_VERIFIED" = "true" ]; then
            git fetch --tags
            if ! git rev-parse "refs/tags/v$version" >/dev/null 2>&1; then
              git tag "v$version"
              git push origin "v$version"
            fi
          fi

      - name: Report updater failures
        if: steps.images.outcome == 'failure' || steps.image_verify.outcome == 'failure' || steps.skills.outcome == 'failure' || steps.cards.outcome == 'failure' || steps.card_verify.outcome == 'failure'
        shell: bash
        run: |
          echo "image updater: ${{ steps.images.outcome }}"
          echo "official image verifier: ${{ steps.image_verify.outcome }}"
          echo "Master skill updater: ${{ steps.skills.outcome }}"
          echo "skill card renderer: ${{ steps.cards.outcome }}"
          echo "skill card verifier: ${{ steps.card_verify.outcome }}"
          exit 1

      - name: Show remaining disk space
        if: always()
        run: df -h
